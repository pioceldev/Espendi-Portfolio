# ============================================================
# Configuration de déploiement Netlify
#   Site statique (index.html) + fonction serverless (Brevo)
# ============================================================

[build]
  command = "bash build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Le formulaire de index.html envoie sur "contact.php" (compatible
# hébergeur PHP). Sur Netlify, on réécrit cette route vers la fonction.
[[redirects]]
  from = "/contact.php"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# Aucun fichier PHP n'est publié (dist/ n'en contient pas) :
# on renvoie explicitement un 404 pour éviter toute fuite de source.
[[redirects]]
  from = "/*.php"
  to = "/"
  status = 404
  force = true

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
